server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin from the browser's point of view: nginx forwards to the server container so
    # the client never needs a build-time API/WS base URL, in docker-compose or in `npm run
    # dev` (see vite.config.ts's dev-server proxy for the equivalent locally).
    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://server:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
